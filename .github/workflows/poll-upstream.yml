name: Poll upstream and publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/poll-upstream.yml"
      - "overlay/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reseam-youtube-compat-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: https://git.reseam.app/reseam/patches.git
      UPSTREAM_RELEASES_API: https://git.reseam.app/api/v1/repos/reseam/patches/releases?limit=100&page=1
      HAS_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY_B64 != '' }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Find the newest stable upstream release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          releases_json="$RUNNER_TEMP/upstream-releases.json"
          release_json="$RUNNER_TEMP/upstream-release.json"
          curl -fsSL --retry 4 --retry-delay 3 "$UPSTREAM_RELEASES_API" -o "$releases_json"

          # Forgejo returns releases newest-first. Ignore drafts and prereleases.
          jq -e '[.[] | select((.draft // false) == false and (.prerelease // false) == false)] | .[0]' \
            "$releases_json" > "$release_json"

          upstream_tag="$(jq -er '.tag_name | select(type == "string" and length > 0)' "$release_json")"
          upstream_commit="$(jq -er '.target_commitish | select(type == "string" and test("^[0-9a-fA-F]{40}$"))' "$release_json")"
          [[ "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Unexpected upstream release tag: $upstream_tag" >&2
            exit 1
          }

          # Keep upstream stable versions stable so GitHub exposes this as /releases/latest.
          bundle_version="${upstream_tag}"
          echo "tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$upstream_commit" >> "$GITHUB_OUTPUT"
          echo "version=$bundle_version" >> "$GITHUB_OUTPUT"

          if gh release view "$bundle_version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published upstream release $upstream_tag as $bundle_version."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # After an unsigned verification build, avoid rebuilding the same upstream
          # release on every poll. A configured permanent key bypasses this marker.
          if [[ "$HAS_SIGNING_KEY" != "true" && -f state/last-verified-upstream.txt ]] \
            && grep -Fxq "$upstream_tag" state/last-verified-upstream.txt \
            && grep -Fxq "$upstream_commit" state/last-verified-upstream.txt; then
            echo "Upstream $upstream_tag was already verified; waiting for the permanent signing key."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream stable release: $upstream_tag ($upstream_commit)"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.upstream.outputs.should_release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.upstream.outputs.should_release == 'true'
        uses: android-actions/setup-android@v4

      - name: Install the newest stable Android platform
        if: steps.upstream.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          platform="$(sdkmanager --list | sed -nE 's/^[[:space:]]*(platforms;android-[0-9]+)[[:space:]]*\|.*/\1/p' | sort -Vu | tail -n1)"
          test -n "$platform" || {
            echo "Android SDK did not report an installable platform." >&2
            exit 1
          }
          sdkmanager --install "$platform"

      - name: Clone the exact upstream release
        if: steps.upstream.outputs.should_release == 'true'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/reseam-upstream"
          git clone --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_REPOSITORY" "$upstream"
          actual="$(git -C "$upstream" rev-parse HEAD)"
          test "$actual" = "$UPSTREAM_COMMIT" || {
            echo "The release tag resolved to $actual, but the release API reported $UPSTREAM_COMMIT." >&2
            exit 1
          }
          echo "UPSTREAM_DIR=$upstream" >> "$GITHUB_ENV"

      - name: Apply the compatibility overlay
        if: steps.upstream.outputs.should_release == 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: python3 overlay/apply_fixes.py "$RUNNER_TEMP/reseam-upstream" "$UPSTREAM_COMMIT"

      - name: Install matching Reseam CLI and signing key
        if: steps.upstream.outputs.should_release == 'true'
        id: signing
        shell: bash
        env:
          BUNDLE_SIGNING_KEY_B64: ${{ secrets.BUNDLE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/reseam-upstream"
          cli_version="$(sed -nE 's/.*id\("app\.reseam\.workspace"\) version "([^"]+)".*/\1/p' "$source/settings.gradle.kts")"
          test -n "$cli_version" || {
            echo "Could not determine the Reseam CLI version from settings.gradle.kts." >&2
            exit 1
          }

          cli="$RUNNER_TEMP/reseam"
          curl -fsSL --retry 4 --retry-delay 3 \
            "https://cdn.reseam.app/engine/v${cli_version}/reseam-linux-x64" -o "$cli"
          chmod +x "$cli"

          key="$RUNNER_TEMP/bundle-signing.key"
          if [[ -n "$BUNDLE_SIGNING_KEY_B64" ]]; then
            printf '%s' "$BUNDLE_SIGNING_KEY_B64" | base64 --decode > "$key"
            echo "publish_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "BUNDLE_SIGNING_KEY_B64 is not configured; making a disposable verification key."
            echo "This run will build and verify the bundle, but will not publish a release."
            "$cli" bundle keygen --out "$key" > "$RUNNER_TEMP/temporary-keygen-output.txt"
            echo "publish_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          chmod 600 "$key"
          test "$(wc -c < "$key" | tr -d ' ')" = "32" || {
            echo "The signing seed must decode to exactly 32 bytes." >&2
            exit 1
          }

          echo "RESEAM_BIN=$cli" >> "$GITHUB_ENV"
          echo "RESEAM_BUNDLE_KEY=$key" >> "$GITHUB_ENV"
          echo "RESEAM_CLI_VERSION=$cli_version" >> "$GITHUB_ENV"

      - name: Build the signed bundle
        if: steps.upstream.outputs.should_release == 'true'
        working-directory: ${{ runner.temp }}/reseam-upstream
        env:
          BUNDLE_VERSION: ${{ steps.upstream.outputs.version }}
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1536m bundle "-PreleaseTag=${BUNDLE_VERSION}"

      - name: Verify the signed bundle and publish it
        if: steps.upstream.outputs.should_release == 'true'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
          BUNDLE_VERSION: ${{ steps.upstream.outputs.version }}
          PUBLISH_ENABLED: ${{ steps.signing.outputs.publish_enabled }}
        run: |
          set -euo pipefail
          set -euo pipefail
          source="$RUNNER_TEMP/reseam-upstream"
          build_dir="$source/build/reseam"

          # The output filename follows manifest.toml [bundle].name. Discover it rather
          # than assuming the upstream project's original bundle name.
          mapfile -d '' bundle_files < <(find "$build_dir" -type f -name '*.reseam' -print0)
          if [[ "${#bundle_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one signed .reseam bundle in $build_dir; found ${#bundle_files[@]}."
            find "$build_dir" -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi
          bundle="${bundle_files[0]}"
          echo "Using signed bundle: $bundle"
          test -s "$bundle"

          public_key="$(unzip -p "$bundle" manifest.pubkey | od -An -v -tx1 | tr -d ' \n')"
          pubkey_bytes="$(unzip -p "$bundle" manifest.pubkey | wc -c | tr -d ' ')"
          if [[ "$pubkey_bytes" != "32" || "${#public_key}" -ne 64 ]]; then
            echo "::error::Expected a 32-byte Ed25519 public key; found $pubkey_bytes bytes."
            exit 1
          fi

          mkdir -p dist
          cp "$bundle" dist/reseam-youtube-compat.reseam
          printf '%s\n' "$public_key" > dist/BUNDLE_PUBLIC_KEY.txt

          if ! "$RESEAM_BIN" bundle list "$bundle" --trust "$public_key" > dist/BUNDLE_CONTENTS.txt 2>&1; then
            echo "::error::Reseam CLI could not verify/list the generated bundle:"
            cat dist/BUNDLE_CONTENTS.txt
            exit 1
          fi

          require_bundle_entry() {
            local needle="$1"
            if ! grep -Fqi -- "$needle" dist/BUNDLE_CONTENTS.txt; then
              echo "::error::Expected patch entry was not found in the signed bundle: $needle"
              cat dist/BUNDLE_CONTENTS.txt
              exit 1
            fi
          }
          require_bundle_entry "Theme"
          require_bundle_entry "Restore classic miniplayer"

          miniplayer_source="$source/apps/youtube/patch/src/main/kotlin/app/reseam/patches/youtube/layout/RestoreClassicMiniplayer.kt"
          test -s "$miniplayer_source"
          grep -Fq 'compatibleWith(YOUTUBE)' "$miniplayer_source"
          grep -Fq 'disableBooleanFeature(MINIPLAYER_MODERN_FEATURE_LEGACY_KEY)' "$miniplayer_source"
          grep -Fq 'disableBooleanFeature(MINIPLAYER_MODERN_FEATURE_KEY)' "$miniplayer_source"

          release_notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Community compatibility bundle based on upstream Reseam patches $UPSTREAM_TAG."
            echo
            echo "Upstream commit: $UPSTREAM_COMMIT"
            echo
            echo "This is not an official Reseam release."
            echo
            echo "## Upstream release notes"
            jq -r '.body // "No upstream release notes supplied."' "$RUNNER_TEMP/upstream-release.json"
            echo
            echo "## Overlay"
            echo "- YouTube AMOLED/dark and light surface resource compatibility."
            echo "- Legacy theme color lookup compatibility."
            echo "- Classic horizontal miniplayer patch (flags 45630429 and 45622882)."
            echo "- Portrait-player status-bar inset compatibility."
          } > "$release_notes"
          cp "$release_notes" dist/RELEASE_NOTES.md
          printf 'Upstream: %s\nCommit: %s\n' "$UPSTREAM_TAG" "$UPSTREAM_COMMIT" > dist/UPSTREAM.txt
          cp LICENSE NOTICE dist/

          (
            cd dist
            sha256sum reseam-youtube-compat.reseam BUNDLE_PUBLIC_KEY.txt BUNDLE_CONTENTS.txt UPSTREAM.txt LICENSE NOTICE RELEASE_NOTES.md > SHA256SUMS.txt
          )

          # Reseam owns both the release upload and the patches.json history. It reads
          # the signed bundle's embedded version and preserves the stable signing key.
          "$RESEAM_BIN" release patches "$bundle" \
            --tag "$BUNDLE_VERSION" \
            --to forge \
            --notes "$release_notes" \
            --homepage "https://github.com/$GITHUB_REPOSITORY"

          # Verify the public GitHub release and the exact feed URL Manager will read.
          release_json="$RUNNER_TEMP/published-release.json"
          gh release view "$BUNDLE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets,url > "$release_json"
          jq -e '
            .isDraft == false and
            .isPrerelease == false and
            ([.assets[].name] | index("patches.json") != null) and
            ([.assets[].name] | index("reseam-youtube-compat.reseam") != null)
          ' "$release_json" >/dev/null || {
            echo "::error::Reseam returned without publishing a stable release containing the bundle and patches.json."
            cat "$release_json"
            exit 1
          }

          verify_dir="$RUNNER_TEMP/verify-release"
          mkdir -p "$verify_dir"
          gh release download "$BUNDLE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern patches.json --dir "$verify_dir"
          jq -e --arg version "$BUNDLE_VERSION" --arg key "$public_key" '
            .bundle.public_key == $key and
            any(.releases[]; .version == $version)
          ' "$verify_dir/patches.json" >/dev/null || {
            echo "::error::Published patches.json is missing the release or does not pin this bundle's signing key."
            cat "$verify_dir/patches.json"
            exit 1
          }

          latest_index="$RUNNER_TEMP/latest-patches.json"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/patches.json" \
            -o "$latest_index"
          jq -e --arg version "$BUNDLE_VERSION" --arg key "$public_key" '
            .bundle.public_key == $key and
            any(.releases[]; .version == $version)
          ' "$latest_index" >/dev/null || {
            echo "::error::The permanent /releases/latest Manager feed does not resolve to the newly published bundle."
            cat "$latest_index"
            exit 1
          }

          echo "Published and verified signed Reseam release $BUNDLE_VERSION."
          echo "Manager feed: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/patches.json"
